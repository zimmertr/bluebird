# The fill's lint (#760): the backend's rules, read for the Python the fill
# image runs, Debian trixie's 3.13, so pyupgrade never asks for syntax the
# image cannot parse. `rules` is the app's module copied in beside fill.py;
# `fill` and `conftest` are the suite's own imports.
extend = "../backend/ruff.toml"
target-version = "py313"

[lint.isort]
known-first-party = ["conftest", "fill", "rules"]
