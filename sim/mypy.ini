# The type checker for sim/app, with the backend's settings (backend/mypy.ini)
# for the same reasons. `make typecheck-sim` runs `mypy app` from sim/.
[mypy]
python_version = 3.14
plugins = pydantic.mypy
strict_optional = True
check_untyped_defs = True
warn_unused_ignores = True
ignore_missing_imports = True
