<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terms | Bluebird Forecast</title>
    <meta
      name="description"
      content="The terms of using Bluebird Forecast: the PolyForm Noncommercial license, no warranty, availability and fair use, and the licenses covering the forecast and destination data."
    />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- Starlette also serves this file at /terms/ as a directory index, so
         both spellings resolve. The canonical points at the no-slash form the
         app links to, which is the one people will paste. -->
    <link rel="canonical" href="https://bluebirdforecast.com/terms" />

    <!-- Its own unfurl rather than the app's: a terms link pasted into a
         thread should say what it is instead of advertising the map. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bluebird Forecast" />
    <meta property="og:title" content="Terms" />
    <meta
      property="og:description"
      content="Free to use, source-available under PolyForm Noncommercial 1.0.0, no warranty, no uptime commitment. The terms of using Bluebird Forecast."
    />
    <meta property="og:url" content="https://bluebirdforecast.com/terms" />
    <meta property="og:image" content="https://bluebirdforecast.com/icon.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/terms.tsx"></script>
  </body>
</html>
