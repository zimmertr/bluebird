version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The OpenAPI type generator is a package apart from the app because
  # openapi-typescript needs the TypeScript 5 compiler API and the app runs
  # TypeScript 7. Its own manifest is what makes it visible here.
  - package-ecosystem: npm
    directory: /frontend/tools/api-types
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript stays on 5 here for as long as openapi-typescript peers on
      # ^5.x. A major bump is the one update this package must never take: it
      # is the whole reason the package is split out of frontend/package.json.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # ESLint is a package apart for a sharper version of the same reason:
  # typescript-eslint reads the TypeScript compiler API and refuses TS 7, and
  # the TS 7 package no longer ships that API at all.
  - package-ecosystem: npm
    directory: /frontend/tools/eslint
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript stays on 6 here for as long as typescript-eslint refuses 7.
      # It throws on import rather than degrading, so a major bump here is a
      # red lint job with no code change on our side.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # The browser suite (#412), a package apart so the app's `npm ci` never
  # downloads Playwright. A bump of @playwright/test must also move the local
  # image tag, PLAYWRIGHT_IMAGE in the Makefile; CI installs the matching Chromium itself.
  - package-ecosystem: npm
    directory: /frontend/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Every action is pinned to a commit SHA with its version in a comment
  # (#632). Dependabot reads that comment, proposes the next release, and
  # rewrites the SHA and the comment together, so a pin moves only by PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Base image bumps (python/node in the Dockerfile). Both are pinned as
  # tag@digest, so a rebuild of the image under the same tag arrives here as
  # a digest PR rather than silently at the next build. These PRs are also the
  # standing remediation path when the scheduled image scan flags a fixable
  # CVE in the released image.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
