version: 2
updates:
  # Every npm and pip entry waits seven days after a release before proposing
  # it (#633). A patch bump auto-merges and a merge to main deploys, so without
  # the wait a release published the day before the weekly run is live the same
  # morning; the npm worms of 2025 were pulled within hours to days. Security
  # updates do not wait: GitHub documents cooldown as version updates only.
  #
  # The pip entry reads requirements.in (the direct pins) and recompiles the
  # hashed requirements.txt and requirements-dev.txt from it with pip-compile,
  # which is what lets the dependency graph and its alerts see Starlette and
  # the rest of the indirect set.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # The OpenAPI type generator is a package apart from the app because
  # openapi-typescript needs the TypeScript 5 compiler API and the app runs
  # TypeScript 7. Its own manifest is what makes it visible here.
  - package-ecosystem: npm
    directory: /frontend/tools/api-types
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # TypeScript stays on 5 here for as long as openapi-typescript peers on
      # ^5.x. A major bump is the one update this package must never take: it
      # is the whole reason the package is split out of frontend/package.json.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # ESLint is a package apart for a sharper version of the same reason:
  # typescript-eslint reads the TypeScript compiler API and refuses TS 7, and
  # the TS 7 package no longer ships that API at all.
  - package-ecosystem: npm
    directory: /frontend/tools/eslint
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # TypeScript stays on 6 here for as long as typescript-eslint refuses 7.
      # It throws on import rather than degrading, so a major bump here is a
      # red lint job with no code change on our side.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # The browser suite (#412), a package apart so the app's `npm ci` never
  # downloads Playwright. A bump of @playwright/test must also move the local
  # image tag, PLAYWRIGHT_IMAGE in the Makefile; CI installs the matching Chromium itself.
  - package-ecosystem: npm
    directory: /frontend/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Base image bumps (python/node in the Dockerfile). Patch tag updates ride
  # the existing auto-merge; these PRs are also the standing remediation path
  # when the scheduled image scan flags a fixable CVE in the released image.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
