version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The OpenAPI type generator is a package apart from the app because
  # openapi-typescript needs the TypeScript 5 compiler API and the app runs
  # TypeScript 7. Its own manifest is what makes it visible here.
  - package-ecosystem: npm
    directory: /frontend/tools/api-types
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Base image bumps (python/node in the Dockerfile). Patch tag updates ride
  # the existing auto-merge; these PRs are also the standing remediation path
  # when the scheduled image scan flags a fixable CVE in the released image.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
