name: Release

# Every merge to main releases through yggdrasil's release module. GitVersion
# reads the bump from the squash commit's title; both images are built for
# linux/amd64 and linux/arm64, pushed under that version and scanned on each
# platform; the commit is tagged and released only when every scan passes;
# then two self-merging PRs point Kubernetes-Manifests and bluebird-helm at
# the release. Decision record 0278.
#
# A release that fails part way is finished with "Re-run failed jobs", never
# "Re-run all jobs": the pushed images are immutable, so pushing them again
# fails. Don't re-run an old release after a newer one shipped: its bump PRs
# would point production back at the older version. Release again instead.
on:
  push:
    branches: [main]

# Serialize releases so concurrent runs don't race on the manifest update
# (last-write-wins once pinned the deployed tag to the lower version). Keep
# cancel-in-progress false so every merge still releases, just one at a time.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    uses: zimmertr/yggdrasil/.github/workflows/release.yml@d8443185af7a5e3b4b197b8ee167533d79c816c5 # v0.14.0
    permissions:
      contents: write # the tag and release
    with:
      # amd64 for the cluster, arm64 for Apple Silicon and Graviton pulls. The
      # planet fill (#760) is released beside the app at the same version,
      # because the chart runs it at its appVersion. It keeps no layer cache:
      # one apt install, and the Actions cache is already over its limit, so
      # every release takes Debian's packages as they stand that day.
      images: >-
        [{"image": "zimmertr/bluebird",
          "platforms": "linux/amd64,linux/arm64",
          "cache": true},
         {"image": "zimmertr/bluebird-fill",
          "file": "fill/Dockerfile",
          "platforms": "linux/amd64,linux/arm64"}]
      # The fixed branches keep one open bump PR each across releases. The
      # chart bump's `chore(release):` title is what makes bluebird-helm
      # release a patch, and it runs after the GitHub release because
      # bluebird-helm's own release reads appVersion from this repo's Latest.
      deploys: >-
        [{"repo": "zimmertr/Kubernetes-Manifests",
          "file": "public/bluebird/kustomization.yml",
          "set": "(.images[] | select(.name == \"zimmertr/bluebird\")).newTag",
          "branch": "chore/bluebird-image",
          "title": "chore: bump bluebird image"},
         {"repo": "zimmertr/bluebird-helm",
          "file": "charts/bluebird/Chart.yaml",
          "set": ".appVersion",
          "branch": "chore/bump-appversion",
          "title": "chore(release): bump chart appVersion"}]
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      # Contents and pull-requests write on Kubernetes-Manifests and
      # bluebird-helm. A PAT, not GITHUB_TOKEN, because a merge made with
      # GITHUB_TOKEN would not start bluebird-helm's release.
      deploy-token: ${{ secrets.GH_PAT }}
