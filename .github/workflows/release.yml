name: Release

on:
  push:
    branches:
      - main
  # Allow manual triggering from the Actions tab for testing without a real merge
  workflow_dispatch:

# Serialize releases so concurrent runs don't race on the manifest update
# (last-write-wins once pinned the deployed tag to the lower version). Keep
# cancel-in-progress false so every merge still releases, just one at a time.
concurrency:
  group: release
  cancel-in-progress: false

# Least-privilege default; jobs that write to the repo override this at the job level
permissions:
  contents: read

jobs:
  # Calculate the next SemVer using GitVersion (conventional commits drive the increment)
  # and bail out early if the Docker Hub image tag already exists (immutability guard)
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      tagExists: ${{ steps.tag-check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # GitVersion needs the full history to calculate the version
      - uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'
      - id: gitversion
        uses: gittools/actions/gitversion/execute@v4
      - name: Check if image tag already exists on Docker Hub
        id: tag-check
        run: |
          if docker manifest inspect zimmertr/bluebird:${{ steps.gitversion.outputs.semVer }} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image tag ${{ steps.gitversion.outputs.semVer }} already exists — skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  # Build the Docker image and push it to Docker Hub, then tag the commit in git
  # Skipped if the image tag already exists (prevents overwriting immutable tags)
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: determine-version
    if: needs.determine-version.outputs.tagExists == 'false'
    # Releases serialize on one concurrency group, so a hung registry push here
    # dams every queued release until GitHub's 6h default kills the job (it
    # blocked deploys for 2.5h on 2026-07-25). Normal multi-arch builds take
    # ~10 minutes; 30 is generous headroom for a cold cache.
    timeout-minutes: 30
    permissions:
      contents: write  # Required to push the git tag
    steps:
      - uses: actions/checkout@v7
      # QEMU provides the arm64 emulation for the multi-platform build below
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 for the cluster, arm64 for Apple Silicon / Graviton pulls
          platforms: linux/amd64,linux/arm64
          push: true
          tags: zimmertr/bluebird:${{ needs.determine-version.outputs.semVer }}
          # Version/revision vary per release, so they're stamped here rather
          # than baked into the Dockerfile's static labels.
          labels: |
            org.opencontainers.image.version=${{ needs.determine-version.outputs.semVer }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Supply-chain attestations. These publish as extra manifests, which
          # Docker Hub's UI lists as "unknown/unknown" platform rows — cosmetic.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tag Release Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.determine-version.outputs.semVer }}" -m "Release v${{ needs.determine-version.outputs.semVer }}"
          git push origin "v${{ needs.determine-version.outputs.semVer }}"

  # Create a GitHub Release with auto-generated release notes from merged PR titles
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [determine-version, build-and-push]
    if: needs.determine-version.outputs.tagExists == 'false'
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.determine-version.outputs.semVer }}
          name: v${{ needs.determine-version.outputs.semVer }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Update the image tag in Kubernetes-Manifests so Argo CD rolls out the new version.
  #
  # This lands through a self-merging PR rather than a direct push: Kubernetes-Manifests
  # forbids direct commits to main, and its "Validate manifests" check renders the
  # affected kustomization before anything reaches Argo CD. A tag that doesn't resolve
  # fails the PR instead of failing a sync.
  #
  # Dependabot-style fixed branch: force-pushed every release and edited in place, so
  # rapid releases collapse into one up-to-date PR rather than a pile of stale ones.
  #
  # GH_PAT must have contents + pull-requests write on zimmertr/Kubernetes-Manifests.
  update-manifests:
    name: Update Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: [determine-version, create-release]
    if: needs.determine-version.outputs.tagExists == 'false'
    steps:
      - uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: '5.4.3'

      - name: Open or update the image bump PR
        env:
          SEMVER: ${{ needs.determine-version.outputs.semVer }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          APP_REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          BR="chore/bluebird-image"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/zimmertr/Kubernetes-Manifests.git" k8s-manifests
          cd k8s-manifests
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Fresh off main every time, so the branch is always exactly one commit
          # carrying the newest tag, never a stack of prior bumps.
          git checkout -B "$BR" origin/main
          (cd public/bluebird && kustomize edit set image zimmertr/bluebird=zimmertr/bluebird:${SEMVER})
          if git diff --quiet; then
            echo "Manifests already at ${SEMVER} — nothing to bump."
            exit 0
          fi
          git commit -am "chore: bump bluebird image to ${SEMVER}"
          git push -f origin "$BR"

          TITLE="chore: bump bluebird image to ${SEMVER}"
          BODY="Automated by the bluebird ${SEMVER} release. Rolls the stable app onto the freshly published \`zimmertr/bluebird:${SEMVER}\` (triggers the canary rollout).

          - Release: ${SERVER_URL}/${APP_REPO}/releases/tag/v${SEMVER}"
          PR_NUM="$(gh pr list --head "$BR" --state open --json number -q '.[0].number')"
          if [ -n "$PR_NUM" ]; then
            # The force-push already advanced the branch. Refresh title and body
            # too: both name the version, so a PR carried across several releases
            # would otherwise advertise a superseded one.
            gh pr edit "$PR_NUM" --title "$TITLE" --body "$BODY"
            echo "Advanced existing PR #${PR_NUM} to ${SEMVER}."
          else
            gh pr create --base main --head "$BR" --title "$TITLE" --body "$BODY"
          fi

          # Re-arm unconditionally: GitHub disables auto-merge whenever the head
          # branch is force-pushed, and this job force-pushes on every release.
          # The || fallback covers the window where the required check has already
          # gone green, which makes the PR "clean" and rejects --auto outright.
          gh pr merge --auto --squash "$BR" || gh pr merge --squash "$BR"

  # Land a commit on bluebird-helm bumping the chart's default image tag
  # (Chart.yaml appVersion) to this release. A chart release only fires on a
  # commit under charts/**, so without this the published chart's default keeps
  # pointing at whatever bluebird release was latest the last time the chart repo
  # happened to change. The chart pipeline's own package-time resolver is the
  # correctness backstop if newer app releases land before this one lands.
  #
  # This goes through a self-merging PR rather than a direct push (the way
  # update-manifests above pushes straight to Kubernetes-Manifests) only because
  # bluebird-helm/main is protected by a required review AND a required "Lint &
  # render" check. GitHub enforces both on direct pushes, and that check only
  # triggers on pull_request, so a push could never satisfy it. Arming auto-merge
  # gets the same hands-off result while keeping helm lint as a gate.
  #
  # Dependabot-style: a fixed branch is force-pushed each release and only one
  # open PR is ever kept, so rapid releases collapse into a single up-to-date PR
  # rather than a pile. GH_PAT must additionally carry contents + pull-requests
  # write on zimmertr/bluebird-helm (it already has them on Kubernetes-Manifests).
  bump-chart-appversion:
    name: Bump Helm Chart appVersion
    runs-on: ubuntu-latest
    needs: [determine-version, build-and-push, create-release]
    if: needs.determine-version.outputs.tagExists == 'false'
    steps:
      - name: Open or update the appVersion bump PR
        env:
          SEMVER: ${{ needs.determine-version.outputs.semVer }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # Provenance for the generated PR body — the app repo, the merge commit
          # that triggered this release, and the base GitHub URL.
          APP_REPO: ${{ github.repository }}
          APP_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          BR="chore/bump-appversion"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/zimmertr/bluebird-helm.git" helm
          cd helm
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Fresh single commit off main every time, so the branch is always the
          # newest appVersion and never a stack of prior bumps.
          git checkout -b "$BR"
          sed -i -E "s|^appVersion:.*|appVersion: \"${SEMVER}\"|" charts/bluebird/Chart.yaml
          if git diff --quiet; then
            echo "Chart appVersion is already ${SEMVER} — nothing to bump."
            exit 0
          fi
          git commit -am "chore(release): bump chart appVersion to ${SEMVER}"
          git push -f origin "$BR"

          # Link the chart bump back to the app release that produced it: the
          # GitHub release, the merge commit, and (best-effort) the PR that merged.
          RELEASE_URL="${SERVER_URL}/${APP_REPO}/releases/tag/v${SEMVER}"
          COMMIT_URL="${SERVER_URL}/${APP_REPO}/commit/${APP_SHA}"
          PR_URL="$(gh api "repos/${APP_REPO}/commits/${APP_SHA}/pulls" -q '.[0].html_url' 2>/dev/null || true)"

          # printf (not a YAML multi-line string) keeps the block's indentation out
          # of the rendered markdown; \` is a literal backtick inside the quotes.
          BODY="$(printf '%s\n\n%s\n- Release: %s\n- Commit: %s' \
            "Automated by the bluebird app release pipeline. Points the chart's default image tag (\`appVersion\`) at the freshly published \`zimmertr/bluebird:${SEMVER}\`. Merging republishes the chart with the new default." \
            "Produced by the app version this points at:" \
            "$RELEASE_URL" "$COMMIT_URL")"
          [ -n "$PR_URL" ] && BODY="$(printf '%s\n- Pull request: %s' "$BODY" "$PR_URL")"

          TITLE="chore(release): bump chart appVersion to ${SEMVER}"
          PR_NUM="$(gh pr list --head "$BR" --state open --json number -q '.[0].number')"
          if [ -n "$PR_NUM" ]; then
            # The force-push already refreshed the branch; refresh the description
            # too so its links track the newest release, not the superseded one.
            gh pr edit "$PR_NUM" --title "$TITLE" --body "$BODY"
            echo "Updated existing PR #${PR_NUM} in place."
          else
            gh pr create --base main --head "$BR" --title "$TITLE" --body "$BODY"
          fi

          # Arm auto-merge so the bump lands without a human. Unconditional on
          # purpose: GitHub disables auto-merge whenever the head branch is
          # force-pushed, and this job force-pushes $BR on every release, so the
          # update-in-place path above must re-arm rather than assume it stuck.
          #
          # Squash because that's the only merge type bluebird-helm allows, and
          # its GitVersion reads the squash commit message ("chore(release):" →
          # patch bump on the chart).
          #
          # GH_TOKEN here is GH_PAT, which is load-bearing: a merge driven by a
          # GITHUB_TOKEN would not fire bluebird-helm/release.yml's `on: push`
          # (GitHub's recursion guard), leaving the bump merged but the chart
          # never republished. Same trap documented in dependabot-auto-merge.yml.
          gh pr merge --auto --squash "$BR"
