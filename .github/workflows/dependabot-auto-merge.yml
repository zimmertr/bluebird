name: Dependabot auto-merge

# Patch and minor Dependabot version updates (record 0273) merge themselves
# once main's required checks pass, then release and deploy like any other
# merge. Majors, and digest-only base image updates, wait for review.
# yggdrasil's auto-merge module, which also posts a comment saying so. Decision
# record 0277.
#
# The merge is armed with AUTO_MERGE_PAT (a Dependabot secret, since a run
# Dependabot starts cannot read Actions secrets), because a merge driven by the
# default GITHUB_TOKEN would NOT trigger release.yml's `on: push` (GitHub's
# recursion guard), leaving the patch merged but undeployed.
on: pull_request

permissions: {}

jobs:
  auto-merge:
    name: Dependabot auto-merge
    uses: zimmertr/yggdrasil/.github/workflows/auto-merge.yml@667ac9372b2be9ed09b67c2da14f6fbd93e2b1b3 # v1.0.0
    permissions:
      pull-requests: write # the comment
    secrets:
      merge-token: ${{ secrets.AUTO_MERGE_PAT }}
