name: PR Checks

# `pull_request` only. A `push` trigger alongside it ran this whole workflow
# TWICE per commit: the two events name different refs (`refs/heads/<branch>`
# and `refs/pull/<n>/merge`), so the concurrency group below could not collapse
# them, and all 20 sampled runs were such a pair (issue #368). They ran in
# parallel, so nobody waited longer, but each commit burned a second set of
# runners and raced the first set to write the same cache keys. The cost of
# dropping it: a branch pushed with no pull request open gets no checks until
# one is opened. Every check branch protection requires is a `pull_request`
# check anyway.
on:
  pull_request:
    branches:
      - main

# Cancel redundant runs when new commits are pushed to the same branch
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege — none of these jobs write to the repo
permissions:
  contents: read

# Every job stops at 15 minutes, one flat number rather than one per job. It
# is over twice the slowest any job has taken: Browser Smoke & Axe peaked at
# 389 s over 150 runs measured 2026-10-15 to 2026-10-22 from the Actions API
# (issue #794). Without it a hung step holds its runner until GitHub's
# 360-minute default rather than failing in minutes.
jobs:
  # Catch TypeScript type errors and unit-test failures before they reach main
  frontend:
    name: Frontend Typecheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `cache: npm`. Measured on 2026-09-15: `npm ci` takes 4 s on a cold
      # cache and 4-5 s on a warm one, while restoring the cache costs 2 s in
      # `setup-node` — so the cache was net negative on time. It was also 50
      # entries and 2.80 GB, one ~56 MB copy per branch, in a repository cache
      # already over GitHub's 10 GB limit and evicting the Docker layers that
      # do pay for themselves (issue #368).
      # The Node major lives in .node-version alone, so these checks run on
      # the runtime the image builds the app with.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
        working-directory: frontend
      # src/api-schema.d.ts is generated from the committed OpenAPI snapshot,
      # and src/api-compat.ts asserts the hand-written wire types against it.
      # This fails the PR when the two disagree, which means someone changed a
      # route or a model without running `npm run generate:api`. It runs before
      # the typecheck because a stale schema fails that with assertion errors
      # that do not say what is actually out of date. The script installs the
      # generator package itself, so no separate `npm ci` step is needed.
      - run: npm run check:api
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      # ESLint (issue #379). It runs after the typecheck because a type error
      # usually explains a lint error, and before the tests because a bad
      # dependency array is cheaper to read here than as a failing assertion.
      # The linter installs itself: it lives in frontend/tools/eslint with its
      # own lockfile, for the TypeScript-version reason recorded there.
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  # Catch Python style and logic issues
  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      # Pin ruff: its default rule set changes between releases, so an unpinned
      # install can turn a green lint red with no code change on our side.
      - run: pip install ruff==0.16.0
      # fill/ruff.toml extends backend/ruff.toml, for the Python the fill
      # image runs rather than the app's.
      - run: ruff check backend/ fill/
      # The locks are pip-compile's output for the .in files (#633): every
      # package pinned and hashed, and the dev lock held to the runtime one by
      # its `-c requirements.txt`. Recompiling keeps every pin already locked,
      # so a diff means an .in file moved without its lock. Renovate's own
      # recompiles come out the same (record 0284).
      - name: The Python locks match their .in files
        run: make lock-backend
      - run: git diff --exit-code backend/requirements.txt backend/requirements-dev.txt

  # Run the backend unit suite: pure logic (aggregation, validation, sorting,
  # error mapping) plus route behavior with the upstream APIs stubbed.
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `cache: pip`, and that is a measurement rather than an oversight.
      # With it, the install drops 8 s to 6 s and `setup-python` grows 2-3 s
      # restoring the 25 MB it saved, so this job lands in the same 26-29 s it
      # takes without it. The wheels are small and already close to the runner;
      # the cache was never paying for a slow download (issue #368).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      # The type check lives here rather than in Python Lint because the
      # pydantic plugin and the FastAPI and Starlette signatures it checks
      # against need the app's own dependencies, which this job has already
      # installed. It runs before pytest because a type error usually explains
      # a failing test. Configuration: backend/mypy.ini.
      - run: mypy app
        working-directory: backend
      - run: pytest -q
        working-directory: backend
      # openapi.json is committed so a contract change shows up as a reviewable
      # diff. This fails the PR when the app and the snapshot disagree, which
      # means someone changed a route, model, or description without running
      # `python scripts/generate_openapi.py`.
      - name: Check OpenAPI snapshot is current
        run: python scripts/generate_openapi.py --check
        working-directory: backend

  # The tests marked `db` (#760): the shared cache's schema, its readers and
  # its writers, against the PostgreSQL with PostGIS that `make
  # test-backend-db` starts. A job of its own so Backend Tests keeps its time,
  # with the database building in the background while Python installs; the
  # image jobs beside it take minutes, so it adds nothing to a PR's wait.
  backend-db:
    name: Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the database in the background
        run: |
          (docker build -q -t bluebird:test-db backend/tests/db \
            && docker run -d --rm --name db-test -p 5432:5432 -e POSTGRES_PASSWORD=test bluebird:test-db) \
            > db.log 2>&1 &
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      # Over TCP, because the image's first start runs a server on its socket
      # alone while it initialises and then restarts it.
      - name: Wait for the database
        run: |
          for _ in $(seq 120); do
            docker exec db-test pg_isready -q -h localhost -U postgres 2>/dev/null && exit 0
            sleep 1
          done
          cat db.log
          echo "::error::The test database did not start. See its log above."
          exit 1
      - run: pytest -m db -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost/postgres

  # The planet fill's image and suite (#760). A job of its own, in parallel
  # with the rest: the fill is a second image with its own Dockerfile, and its
  # end-to-end test needs a PostgreSQL with PostGIS that no other job starts.
  #
  # No GitHub Actions layer cache, unlike Docker Build. The repository's cache
  # is already over GitHub's 10 GB limit and evicting the app's layers, and
  # both builds here are one apt install each, which the background start
  # below hides behind each other anyway.
  fill:
    name: Planet Fill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: fill/Dockerfile
      # The database builds and starts in the background while the fill image
      # builds, so the job waits for the slower of the two rather than both.
      # The same steps as `make test-fill`.
      - name: Build the image and run the suite
        run: |
          docker network create fill-net
          (docker build -q -t bluebird:test-db backend/tests/db \
            && docker run -d --rm --name fill-db --network fill-net -e POSTGRES_PASSWORD=test bluebird:test-db) \
            > db.log 2>&1 &
          db=$!
          docker build -f fill/Dockerfile -t bluebird:fill .
          docker build -f fill/Dockerfile --target test -t bluebird:fill-test .
          if ! wait "$db"; then
            cat db.log
            echo "::error::The test database did not start. See its log above."
            exit 1
          fi
          docker run --rm --network fill-net \
            -e TEST_DATABASE_URL=postgresql://postgres:test@fill-db/postgres bluebird:fill-test

      # The same gate Docker Build applies to the app's image (yggdrasil's
      # docker-build module), so the release scan of the pushed fill image
      # holds no surprise. No scan settings: the one rule in yggdrasil's
      # default skips pip's vendored SBOM, and this image installs no pip. No
      # PR comment: the app's sticky comment is the one place people look,
      # and this job's summary carries the table when it fails.
      - name: Fail on fixable Critical or High vulnerabilities (Trivy)
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bluebird:fill
          output: trivy.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Report the findings
        if: failure() && steps.scan.outcome == 'failure'
        run: cat trivy.txt >> "$GITHUB_STEP_SUMMARY"

  # yggdrasil's docker-build module: hadolint, the linux/amd64 image built but
  # not pushed, a Trivy scan with a sticky PR comment, the structure test below,
  # and a refusal on any fixable Critical or High. amd64-only on purpose: this
  # gate proves the Dockerfile assembles; the release workflow builds the arm64
  # half (emulated builds would roughly double this job for no extra signal).
  # The scan settings are yggdrasil's default trivy.yaml. Decision records
  # 0276 and 0278.
  docker-build:
    # Branch protection requires `Docker Build / Docker Build` (this job's
    # name, then the module's); renaming either strands PRs on a phantom
    # "Expected" check that never reports.
    name: Docker Build
    uses: zimmertr/yggdrasil/.github/workflows/docker-build.yml@60088d4f7cc03c82288314b672ff30399210c5ed # v1.5.0
    permissions:
      contents: read
      pull-requests: write # the sticky scan comment
    with:
      cache: true
      # The browser and Lighthouse jobs load this image rather than build it
      # again (the Lighthouse job's comment has the measurement).
      upload-image: true
      # A sentinel rather than a real version: the structure test asserts this
      # exact string comes back through the app, which is what proves the
      # ARG -> ENV -> endpoint chain survived a Dockerfile edit.
      build-args: |
        APP_VERSION=0.0.0-ci
        APP_COMMIT=${{ github.sha }}
        APP_BUILT_AT=1970-01-01T00:00:00Z
      # What only a built image can show, in tests/structure-test.yaml: the
      # files the build output must hold, and the sentinel version read back
      # through the app. The HTTP behaviour behind those files is the
      # backend's own tests, against stand-ins at the same paths (record 0060
      # in yggdrasil).
      structure-test: tests/structure-test.yaml

  # The cold-load gate (issue #337). Separate from Docker Build because that
  # job's name is branch-protected and because a red Lighthouse run should say
  # "the first screen got heavier", not hide inside a scan report.
  #
  # `needs: docker-build` is for the image: that job saves the one it built as
  # an artifact, and this one loads it rather than building it again. Measured
  # 2026-10-27 over ten runs each (issue #794): the download and load take 6 s
  # median against 16 s for setting up buildx and replaying the build from the
  # Actions cache, and Docker Build pays 4 s once to save and upload a 50 MB
  # artifact.
  lighthouse:
    name: Lighthouse Budgets
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bluebird-image
      - name: Load the image
        run: |
          docker load -i bluebird-image.tar
          docker tag bluebird:pr-scan bluebird:lighthouse

      - name: Serve the built image
        run: |
          docker run -d --rm --name lighthouse-target -p 8000:8000 bluebird:lighthouse
          for _ in $(seq 1 30); do
            curl -fsS localhost:8000/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS localhost:8000/ >/dev/null

      # The budgets, the blocked third-party hosts, and the reasoning behind
      # both live in .github/lighthouserc.js.
      - name: Audit the first screen
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: .github/lighthouserc.js
          # The HTML reports land in the run's artifacts, so a failure can be
          # read rather than guessed at. Nothing is uploaded off GitHub.
          uploadArtifacts: true
          temporaryPublicStorage: false

  # The browser smoke suite and the axe audit (issue #412): the one check that
  # operates the app. It draws a ring, analyzes, and opens a share link against
  # the image this PR built, with every third-party host answered from fixtures
  # in frontend/e2e/fixtures.ts, so it spends no Open-Meteo quota and no
  # upstream outage can turn it red.
  #
  # Shaped like the Lighthouse job: `needs: docker-build` is for the image
  # artifact, which this job loads rather than building again.
  #
  # Chromium alone is installed on the plain runner, which already carries the
  # libraries it needs. `--with-deps` ran apt on every run, and on 2026-10-22 a
  # slow mirror held it for 588 s (job 120075136268). Measured 2026-10-27 over
  # ten runs each (issue #794): Chromium alone installs in 1 s median, and the
  # Playwright image, the other way to skip apt, pulled in 29 s median and 34 s
  # at most. Neither flaked, and the two specs that measure text width
  # (popupFit, scaleBar) passed without the fonts apt installed. The image
  # stays the way to run the suite locally (docs/DEVELOPMENT.md; record 0232).
  browser:
    name: Browser Smoke & Axe
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bluebird-image
      - name: Load the image
        run: |
          docker load -i bluebird-image.tar
          docker tag bluebird:pr-scan bluebird:browser

      - name: Serve the built image
        run: |
          docker run -d --rm --name browser-target -p 8000:8000 bluebird:browser
          for _ in $(seq 1 30); do
            curl -fsS localhost:8000/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS localhost:8000/ >/dev/null

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
        working-directory: frontend/e2e

      # Keyed on the exact Playwright version, because each release pins its
      # own Chromium build and a browser from another release will not launch.
      - name: Read the Playwright version
        id: pw
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' frontend/e2e/package-lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.version }}
      - run: npx playwright install chromium
        working-directory: frontend/e2e

      # Two invocations, the motion specs alone after the rest: the reason is
      # in frontend/e2e/playwright.config.ts.
      - run: npm test
        working-directory: frontend/e2e
        env:
          BASE_URL: http://localhost:8000

      # The HTML report carries a trace and a screenshot of every failed
      # test, so a red run can be read rather than guessed at.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report
          retention-days: 7
