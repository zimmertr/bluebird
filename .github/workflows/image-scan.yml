name: Scheduled Image Scan

# The PR-time scan gates what enters Docker Hub, but CVEs are published after
# images ship, and the deployed image rots while nothing rebuilds it. This
# re-checks each image at the latest release on a clock, sends the findings to
# the Security tab, and fails (and GitHub emails) only when a fixable
# Critical/High exists, i.e. only when there is something to do. yggdrasil's
# image-scan module, reading this repo's trivy.yaml. Decision record 0277.
on:
  schedule:
    - cron: '17 14 * * 1' # Mondays 14:17 UTC, off the top of the hour, when GitHub sheds cron load
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: Scheduled Image Scan
    uses: zimmertr/yggdrasil/.github/workflows/image-scan.yml@4e5afc95d7f3ba6c99d18e245fd3cf726c72fb63 # v0.8.1
    permissions:
      contents: read
      security-events: write # the SARIF upload
    with:
      # Each category stays what it was, so its alert history holds. The fill
      # image (#760) is released beside the app at the same version.
      images: |
        [
          {
            "image": "zimmertr/bluebird",
            "category": "trivy-released-image",
            "remedy": "Merge the open Dependabot base-image PR and release. If there is none, the base tag is current and the packages under it are not: the next merge to main rebuilds the apk upgrade layer against Alpine's current index and releases it. See docs/CICD.md."
          },
          {
            "image": "zimmertr/bluebird-fill",
            "category": "trivy-released-fill-image",
            "remedy": "Merge the open Dependabot base-image PR for fill/Dockerfile and release. If there is none, the next merge to main rebuilds the fill image without a layer cache, taking Debian's current security fixes, and releases it. See docs/CICD.md."
          }
        ]
