name: Scheduled Image Scan

# The PR-time scan gates what enters Docker Hub, but CVEs are published after
# images ship — the deployed image rots while nothing rebuilds it. This scan
# re-checks the latest *released* image on a clock. Two outputs:
#   - SARIF → the repo Security tab (code-scanning alerts, full history)
#   - a red run (→ GitHub failure email) only when a *fixable* Critical/High
#     exists, i.e. only when there is something to actually do. Remediation is
#     usually merging the waiting Dependabot base-image PR, which cuts a patch
#     release on the fresh base.
on:
  schedule:
    - cron: '17 14 * * 1'  # Mondays 14:17 UTC — off the top of the hour, when GitHub sheds cron load
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan released image (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload to the Security tab
    strategy:
      # Report both images even when one fails, so one look covers both.
      fail-fast: false
      matrix:
        include:
          # The app's category stays what it was, so its alert history holds.
          - image: bluebird
            category: trivy-released-image
            remedy: >-
              Merge the open Dependabot base-image PR and release. If there is
              none, the base tag is current and the packages under it are not:
              the next merge to main rebuilds the apk upgrade layer against
              Alpine's current index and releases it. See docs/CICD.md.
          # The planet fill (#760), released beside the app at the same version.
          - image: bluebird-fill
            category: trivy-released-fill-image
            remedy: >-
              Merge the open Dependabot base-image PR for fill/Dockerfile and
              release. If there is none, the next merge to main rebuilds the
              fill image without a layer cache, taking Debian's current
              security fixes, and releases it. See docs/CICD.md.
    steps:
      # This job scans a published image, not a checkout, so the only thing
      # wanted from the repo is trivy.yaml: the same file-level exclusions the
      # PR gate applied. Without it a release could pass pr.yml and then fail
      # here on findings that gate deliberately ruled out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve latest release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "semver=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Scanning zimmertr/${IMAGE}:${TAG#v}"

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zimmertr/${{ matrix.image }}:${{ steps.release.outputs.semver }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          trivy-config: trivy.yaml

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy.sarif
          category: ${{ matrix.category }}

      # Rendered from the SARIF's source scan re-run as JSON so the gate uses
      # the same ignore-unfixed filtering; trivy is on PATH via the action above.
      - name: Re-scan as JSON
        env:
          SEMVER: ${{ steps.release.outputs.semver }}
          IMAGE: ${{ matrix.image }}
        run: |
          trivy image --format json --output trivy.json --ignore-unfixed \
            --config trivy.yaml \
            "zimmertr/${IMAGE}:${SEMVER}"

      - name: Count Critical/High vulnerabilities
        id: crit
        uses: ./.github/actions/trivy-crit-high
        with:
          report: trivy.json

      - name: Fail on fixable Critical/High vulnerabilities
        env:
          CRIT_HIGH: ${{ steps.crit.outputs.count }}
          SEMVER: ${{ steps.release.outputs.semver }}
          IMAGE: ${{ matrix.image }}
          REMEDY: ${{ matrix.remedy }}
        run: |
          if [ "$CRIT_HIGH" -gt 0 ]; then
            echo "::error::${CRIT_HIGH} fixable Critical/High vulnerabilities in zimmertr/${IMAGE}:${SEMVER}. ${REMEDY}"
            exit 1
          fi
          echo "No fixable Critical/High vulnerabilities." >> "$GITHUB_STEP_SUMMARY"
