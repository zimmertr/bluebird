name: Lint

# yggdrasil's lint module: actionlint and zizmor's pedantic audits over the
# workflows and actions, and Semgrep's rule that every
# Dockerfile FROM carries a digest. It replaces this repo's own tests of those
# rules. Decision record 0279.
#
# Branch protection requires `Lint / actionlint`, `Lint / zizmor` and
# `Lint / semgrep` (this job's name, then the module's); renaming either
# strands PRs on a check that never reports.
on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  lint:
    name: Lint
    uses: zimmertr/yggdrasil/.github/workflows/lint.yml@667ac9372b2be9ed09b67c2da14f6fbd93e2b1b3 # v1.0.0
    permissions:
      contents: read
