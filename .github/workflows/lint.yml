name: Lint

# yggdrasil's lint module: actionlint and zizmor's pedantic audits over the
# workflows and actions, Semgrep's rule that every Dockerfile FROM carries a
# digest, shellcheck over the scripts, and the docs' links and em dashes. It
# replaces this repo's own tests of those rules. Decision records 0279 and
# 0306.
#
# Branch protection requires `Lint / actionlint`, `/ zizmor`,
# `/ semgrep`, `/ shellcheck` and `/ docs` (this job's name, then the
# module's); renaming either strands PRs on a check that never reports.
on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  lint:
    name: Lint
    uses: zimmertr/yggdrasil/.github/workflows/lint.yml@2581d736b8cbff87c94c055f985062a73cffdccb # v3.1.3
    permissions:
      contents: read
