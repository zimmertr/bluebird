name: PR Title

# The PR title becomes the squash commit's title, and that line alone decides
# the release bump (yggdrasil's default GitVersion.yml). This refuses a title
# the pipeline cannot read, before the merge rather than after the release.
# yggdrasil's pr-title module, which allows the same types as the release
# module's GitVersion rules. Decision records 0276 and 0278.
#
# A workflow of its own rather than a job in pr.yml, because it has to run when
# only the title changes (`edited`), and an edit must not restart pr.yml's whole
# suite. `synchronize` stays in the list because a check reports against the
# head commit, so a push with no run of its own would carry no result.
#
# Branch protection requires `PR Title / PR Title` (this job's name, then the
# module's); renaming either strands PRs on a check that never reports.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions: {}

jobs:
  title:
    name: PR Title
    uses: zimmertr/yggdrasil/.github/workflows/pr-title.yml@95c4f710c3600dba170ed579c0beabab507011b9 # v0.9.2
    permissions:
      pull-requests: read # the module reads the PR's current title
