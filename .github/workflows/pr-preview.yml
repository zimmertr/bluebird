name: PR Preview Image

# Each PR's preview image, from yggdrasil's pr-preview module: pushed to
# ghcr.io/zimmertr/bluebird-pr as pr-<N>-<head sha>, the tag the Argo CD pull
# request generator in Kubernetes-Manifests public/bluebird-pr/ looks for.
# The owner's own PRs also get the `create pr container` label, which starts
# the preview, and one comment with its address. The module skips a fork's PR.
#
# `pull_request`, never `pull_request_target`: a fork's run gets no write token
# and no secret (yggdrasil record 0010). Renovate's branches live in this repo,
# so its runs still get the `packages: write` this job asks for. Record 0300.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

# One build per PR; newer commits supersede in-flight builds.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  preview:
    name: PR Preview
    uses: zimmertr/yggdrasil/.github/workflows/pr-preview.yml@f5661bbe5864dfae07e6dbd603489e2326980b3d # v2.0.0
    permissions:
      contents: read
      packages: write # the preview image
      pull-requests: write # the label and the comment
    with:
      image: ghcr.io/zimmertr/bluebird-pr
      url: http://pr-${{ github.event.pull_request.number }}.ganymede.sol.milkyway
      title: Bluebird Forecast preview environment
