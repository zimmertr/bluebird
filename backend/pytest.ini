[pytest]
# asyncio_mode = auto lets async test functions run without a per-test marker.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# The suite runs from backend/; make the `app` package importable without an install.
pythonpath = .
testpaths = tests
markers =
    db: needs the PostgreSQL that `make test-backend-db` starts; skipped without TEST_DATABASE_URL
