# Ruff's defaults are E4, E7, E9 and F only, which is no import sorting, no
# bugbear and no pyupgrade (issue #379). The set below is the whole of what the
# repo runs; `ruff check backend/` from the repo root and `ruff check .` inside
# backend/ both find this file by walking up from each source file, so the two
# invocations cannot disagree.
target-version = "py314"
line-length = 120

[lint]
select = ["E", "F", "I", "B", "UP", "TID251"]
# UP042 wants `class X(str, Enum)` rewritten as `StrEnum`. These four enums
# cross the wire: Pydantic serializes them, the OpenAPI snapshot publishes
# them, and StrEnum changes what `str()` and an f-string produce for a member
# (the value rather than `Class.member`). That is a contract question rather
# than a modernization, so it is not this change's to answer.
ignore = ["UP042"]

[lint.flake8-tidy-imports.banned-api]
# A bare HTTPException answers `{"detail": ...}` and nothing else, which is the
# shape the error-code contract replaces, and the omission is invisible: the
# route still works, and only a client branching on the code notices. Scoped to
# the modules that answer a request by the per-file ignore below; the document
# pages in main.py raise a plain one on purpose. The last two names are the same
# class reached through a module that imports it.
"fastapi.HTTPException".msg = "Raise ApiError(..., code=ErrorCode.x) instead."
"starlette.exceptions.HTTPException".msg = "Raise ApiError(..., code=ErrorCode.x) instead."
"app.error_codes.HTTPException".msg = "Raise ApiError(..., code=ErrorCode.x) instead."
"app.main.HTTPException".msg = "Raise ApiError(..., code=ErrorCode.x) instead."

[lint.isort]
# Without this, `app` is a first-party package from inside backend/ and a
# third-party one from the repo root, and the two working directories sort the
# same imports differently. CI runs from the root; a developer runs from here.
known-first-party = ["app"]

[lint.per-file-ignores]
# The KML fixture in this file is the document NOAA's own file server sends.
# Wrapping its one long line would change the data under test.
"tests/test_hms.py" = ["E501"]
# The HTTPException ban above holds where a request is answered, and nowhere
# else: error_codes.py subclasses it, and main.py raises one for a missing page.
"!app/{routes,ratelimit}/**" = ["TID251"]
