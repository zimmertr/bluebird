# The type checker for backend/app. CI runs `mypy app` from backend/, at the
# version requirements-dev.txt pins, and fails the PR on any error.
[mypy]
python_version = 3.14
# The plugin reads Pydantic's field and validator semantics, so a model's
# constructor is checked against its fields rather than accepted as **kwargs.
plugins = pydantic.mypy
strict_optional = True
# Most route and helper bodies here predate annotations. Without this, mypy
# skips the inside of every unannotated function and reports nothing there.
check_untyped_defs = True
# An ignore that no longer suppresses anything is a stale claim about the code.
warn_unused_ignores = True
# Several dependencies ship no type information. Their calls read as Any
# rather than failing the run on a missing stub.
ignore_missing_imports = True

